apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-frontend
  namespace: default
  labels:
    app: ml-platform-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-platform-frontend
  template:
    metadata:
      labels:
        app: ml-platform-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: frontend
          # CHANGE THIS to your Docker Hub username
          image: YOUR_DOCKERHUB_USERNAME/ml-platform-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-platform-frontend
  namespace: default
spec:
  type: NodePort
  selector:
    app: ml-platform-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
