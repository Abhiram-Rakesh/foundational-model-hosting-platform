apiVersion: v1
kind: ResourceQuota
metadata:
  name: user-1-quota
  namespace: user-1
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 40Gi
    limits.cpu: "16"
    limits.memory: 48Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: user-1-limits
  namespace: user-1
spec:
  limits:
    - default:
        cpu: "4"
        memory: 8Gi
      defaultRequest:
        cpu: "2"
        memory: 4Gi
      max:
        cpu: "8"
        memory: 16Gi
      min:
        cpu: 500m
        memory: 1Gi
      type: Container
