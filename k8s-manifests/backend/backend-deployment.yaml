apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-backend
  namespace: default
  labels:
    app: ml-platform-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-platform-backend
  template:
    metadata:
      labels:
        app: ml-platform-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: backend
          image: cloudseederabhi/ml-platform-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - secretRef:
                name: backend-secrets
          env:
            - name: PG_HOST
              value: "postgres-postgresql.default.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              value: "ml_platform"
            - name: PG_USER
              value: "postgres"
            - name: GIT_REPO_PATH
              value: "/app/repo"
            - name: ARGOCD_URL
              value: "https://argocd-server.argocd.svc.cluster.local:443"
            - name: CLUSTER_IP
              value: "172.25.2.51"
            - name: PORT
              value: "3001"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/models
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/models
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-platform-backend
  namespace: default
spec:
  type: NodePort
  selector:
    app: ml-platform-backend
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
